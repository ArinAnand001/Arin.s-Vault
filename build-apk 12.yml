# Builds the Vault Android app from the newest .zip in this repository and publishes it at:
#   https://github.com/<you>/<repo>/releases/latest/download/Vault.apk
#
# Also sends notifications to everyone who has the app:
#   Actions › Vault app › Run workflow › type a message › Run workflow
#
# This file must be at .github/workflows/build-apk.yml to run.

name: Vault app

on:
  push:
    paths-ignore:
      - 'notifications.json'
      - 'signing/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title (optional)'
        required: false
        default: ''
      message:
        description: 'Notification message for everyone who has the app. Leave empty to just rebuild the app.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: vault-app
  cancel-in-progress: false

env:
  # The app's name on the phone. Change it here, then upload this file again.
  APP_NAME: Vault

jobs:
  notify:
    name: Send a notification
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.message != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add the message to notifications.json
        env:
          TITLE: ${{ github.event.inputs.title }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, secrets, time
          path = pathlib.Path("notifications.json")
          data = {"messages": []}
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  print("::warning::notifications.json was damaged, starting a new one")
          messages = data.get("messages") or []
          messages.insert(0, {
              "id": "m%d-%s" % (time.time(), secrets.token_hex(2)),
              "title": os.environ.get("TITLE", "").strip(),
              "body": os.environ["MESSAGE"].replace("\\n", "\n").strip(),
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          data["messages"] = messages[:50]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Save it
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications.json
          git commit -m "Send a notification"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "### Notification sent" >> "$GITHUB_STEP_SUMMARY"
              echo "Phones get it within about an hour, or right away when someone opens the app." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Couldn't save the notification. Run it again."
          exit 1

  build:
    name: Build the app
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.message == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the newest app zip
        id: src
        run: |
          set -euo pipefail
          best=""
          best_t=0
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)
            t=${t:-0}
            if [ "$t" -ge "$best_t" ]; then best="$f"; best_t="$t"; fi
          done < <(find . -path ./.git -prune -o -type f -iname '*.zip' -print0)
          if [ -z "$best" ]; then
            echo "::error::No .zip file found. Upload Vault-app.zip (Add file › Upload files), without unzipping it."
            exit 1
          fi
          echo "Building from $best"
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$best" -d "$RUNNER_TEMP/src"
          settings=$(find "$RUNNER_TEMP/src" -name settings.gradle -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::$best doesn't contain the app project. Upload Vault-app.zip exactly as you received it."
            exit 1
          fi
          echo "dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
          echo "zip=${best#./}" >> "$GITHUB_OUTPUT"

      - name: Set up Java and Gradle
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Reuse files downloaded by earlier builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.zip') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the signing key
        env:
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          KS="signing/release.keystore"
          if [ -z "$SECRET_PASSWORD" ] && [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret first (Settings › Secrets and variables › Actions › New repository secret), then run this again. The app's Google sign-in and updates depend on a signing key that never changes."
            exit 1
          fi
          PASS="${SECRET_PASSWORD:-vault-release-key}"
          if [ -f "$KS" ]; then
            if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias vault >/dev/null 2>&1; then
              echo "::error::KEYSTORE_PASSWORD doesn't match the saved signing key. Put back the password you used the first time."
              exit 1
            fi
            echo "Using the saved signing key, so this version installs over the old one."
          else
            mkdir -p signing
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias vault -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${APP_NAME}, O=Personal"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "Save the app signing key so future builds install as updates"
            BRANCH="${GITHUB_REF_NAME}"
            ok=false
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then ok=true; break; fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Couldn't save the signing key to the repository. Run the build again."
              exit 1
            fi
            echo "Created and saved a new signing key in $KS."
          fi
          KP="$GITHUB_WORKSPACE/$KS"
          SHA1=$(keytool -exportcert -rfc -keystore "$KP" -storepass "$PASS" -alias vault | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          echo "KEYSTORE_PATH=$KP" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          {
            echo "### For Google sign-in (Google Cloud › Clients › Android)"
            echo "- Package name: \`com.anand.vault\`"
            echo "- SHA-1 certificate fingerprint: \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          PROJ: ${{ steps.src.outputs.dir }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')
          SAFE=${SAFE:-Vault}
          echo "APK_FILE=$SAFE.apk" >> "$GITHUB_ENV"
          cd "$PROJ"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$SAFE.apk"
          ls -la "$GITHUB_WORKSPACE/$SAFE.apk"

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.src.outputs.zip }}
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}"
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA" || true)
          case "$SUBJECT" in
            "Add files via upload"|"Upload files"|Update*|Create*|Delete*|"Save the app signing key"*|"Send a notification"*) SUBJECT="" ;;
          esac
          SIZE=$(stat -c %s "$APK_FILE")
          N="$N" SUBJECT="$SUBJECT" SIZE="$SIZE" python3 - <<'PY'
          import datetime, json, os
          n = int(os.environ["N"])
          json.dump({
              "versionCode": n,
              "versionName": "1.%d" % n,
              "apk": os.environ["APK_FILE"],
              "size": int(os.environ["SIZE"]),
              "notes": os.environ.get("SUBJECT", ""),
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, open("version.json", "w"))
          PY
          LINK="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_FILE}"
          NOTES=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Built from \`$ZIP\`." \
            "**Install:** open this page on your Android phone, tap **$APK_FILE**, then tap Install. If Android asks, allow installs from this source. People who already have the app can update from **Settings › App update** inside the app." \
            "**Download link (always the newest version):** $LINK" \
            "Google sign-in setup: package \`com.anand.vault\`, SHA-1 \`$SHA1\`")
          gh release create "v1.$N" "$APK_FILE" version.json --title "${APP_NAME} 1.$N" --notes "$NOTES" --latest --target "$(git rev-parse HEAD)"
          # keep the five newest builds
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
          {
            echo "### ${APP_NAME} 1.$N is ready"
            echo "Download: $LINK"
          } >> "$GITHUB_STEP_SUMMARY"
