# Builds the Android app from Vault-app.zip and publishes the newest APK as a GitHub Release.
# Notifications can be sent from Actions > Vault app > Run workflow.
#
# Signing safety:
# Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD as GitHub Actions repository secrets.
# The keystore is written only to the temporary runner and is never committed to this public repository.

name: Vault app

on:
  push:
    paths:
      - 'Vault-app.zip'
      - 'vault-app/**'
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title (optional)'
        required: false
        default: ''
      message:
        description: 'Notification message for everyone who has the app. Leave empty to just rebuild the app.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: vault-app
  cancel-in-progress: false

env:
  APP_NAME: Vault

jobs:
  notify:
    name: Send a notification
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.message != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the message to notifications.json
        env:
          TITLE: ${{ github.event.inputs.title }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, secrets, time
          path = pathlib.Path("notifications.json")
          data = {"messages": []}
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  print("::warning::notifications.json was damaged, starting a new one")
          messages = data.get("messages") or []
          messages.insert(0, {
              "id": "m%d-%s" % (time.time(), secrets.token_hex(2)),
              "title": os.environ.get("TITLE", "").strip(),
              "body": os.environ["MESSAGE"].replace("\\n", "\n").strip(),
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          data["messages"] = messages[:50]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Save the notification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications.json
          git commit -m "Send a notification"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "### Notification sent" >> "$GITHUB_STEP_SUMMARY"
              echo "The app checks for new notifications when it opens and during its background refresh." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not save the notification. Run it again."
          exit 1

  build:
    name: Build and publish the APK
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.message == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate the Android project
        id: src
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/vault-app"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            ZIP="$GITHUB_WORKSPACE/Vault-app.zip"
            if [ ! -f "$ZIP" ]; then
              echo "::error::Neither the extracted vault-app project nor Vault-app.zip was found."
              exit 1
            fi
            rm -rf "$RUNNER_TEMP/vault-src"
            mkdir -p "$RUNNER_TEMP/vault-src"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/vault-src"
            SETTINGS=$(find "$RUNNER_TEMP/vault-src" -name settings.gradle -not -path '*/__MACOSX/*' | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::Vault-app.zip does not contain an Android Gradle project (settings.gradle missing)."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The Android app module app/build.gradle is missing."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are not set on this runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK licence acceptance failed."
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "Android SDK ready at $SDK_ROOT"

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Vault-app.zip') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "BUILD_CHANNEL=preview" >> "$GITHUB_ENV"
            echo "::warning::No private release keystore is configured. Building a debug-signed preview APK for testing only."
            {
              echo "### Preview build (debug-signed)"
              echo "This APK is for installation/testing only. It is not an update-compatible production release."
              echo "Before distributing updates, add KEYSTORE_BASE64 and KEYSTORE_PASSWORD as Actions secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Both KEYSTORE_BASE64 and KEYSTORE_PASSWORD must be configured, or both left empty for a preview build."
            exit 1
          fi
          KS="$RUNNER_TEMP/vault-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias vault >/dev/null 2>&1; then
            echo "::error::The signing secrets are invalid or the keystore alias is not 'vault'."
            exit 1
          fi
          SHA1=$(keytool -exportcert -rfc -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias vault | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          echo "BUILD_CHANNEL=stable" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          {
            echo "### Android signing details"
            echo "- Package name: `com.anand.vault`"
            echo "- SHA-1 certificate fingerprint: `$SHA1`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          PROJECT_DIR: ${{ steps.src.outputs.dir }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')
          SAFE=${SAFE:-Vault}
          if [ "${BUILD_CHANNEL:-preview}" = "stable" ]; then
            echo "APK_FILE=$SAFE.apk" >> "$GITHUB_ENV"
          else
            echo "APK_FILE=$SAFE-preview.apk" >> "$GITHUB_ENV"
          fi
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK_FILE"
          ls -lh "$GITHUB_WORKSPACE/$APK_FILE"

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}"
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA" || true)
          SIZE=$(stat -c %s "$APK_FILE")
          N="$N" SUBJECT="$SUBJECT" SIZE="$SIZE" python3 - <<'PY'
          import datetime, json, os
          json.dump({
              "versionCode": int(os.environ["N"]),
              "versionName": "1.%s" % os.environ["N"],
              "apk": os.environ["APK_FILE"],
              "size": int(os.environ["SIZE"]),
              "notes": os.environ.get("SUBJECT", ""),
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, open("version.json", "w"), indent=2)
          PY
          if [ "${BUILD_CHANNEL:-preview}" = "stable" ]; then
            TAG="v1.$N"
            LINK="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$APK_FILE"
            NOTES="Install: download $APK_FILE and tap Install. Existing users can update from inside the app. Always-current APK: $LINK"
            gh release create "$TAG" "$APK_FILE" version.json --title "${APP_NAME} 1.$N" --notes "$NOTES" --latest --target "$GITHUB_SHA"
            gh release list --limit 100 --json tagName,createdAt,isPrerelease --jq 'map(select(.isPrerelease == false)) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
              while read -r tag; do gh release delete "$tag" --yes --cleanup-tag || true; done
            echo "### Stable ${APP_NAME} 1.$N is ready" >> "$GITHUB_STEP_SUMMARY"
          else
            TAG="preview-v1.$N"
            LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$APK_FILE"
            NOTES="PREVIEW BUILD — signed with a temporary GitHub Actions debug key. For testing only; this APK cannot be updated by future builds signed with another key. Configure a private release keystore before distributing. Download: $LINK"
            gh release create "$TAG" "$APK_FILE" version.json --title "${APP_NAME} Preview 1.$N (debug-signed)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
            echo "### Preview ${APP_NAME} 1.$N is ready (debug-signed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Download: $LINK" >> "$GITHUB_STEP_SUMMARY"
