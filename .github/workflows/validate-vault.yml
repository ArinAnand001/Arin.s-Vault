name: Validate Vault Android build

on:
  push:
    paths:
      - 'vault-app/**'
      - '.github/workflows/validate-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-android-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Compile Android app (validation only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not available on this runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK licence acceptance failed."
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: validation-gradle-${{ runner.os }}-${{ hashFiles('vault-app/**/*.gradle', 'vault-app/**/*.gradle.kts') }}
          restore-keys: |
            validation-gradle-${{ runner.os }}-

      - name: Check embedded Notes UI JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("vault-app/app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No embedded JavaScript was found in index.html")
          pathlib.Path("${{ runner.temp }}/vault-ui.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/vault-ui.js"

      - name: Compile debug variant
        working-directory: vault-app
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload validation APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-validation-${{ github.run_number }}
          path: vault-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: Validation summary
        run: |
          {
            echo "### Android validation completed"
            echo "The debug variant compiled successfully."
            echo "The uploaded APK is a temporary CI validation artifact, not a distributable release or in-place update."
            echo "A stable release still requires the permanent KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets."
          } >> "$GITHUB_STEP_SUMMARY"
