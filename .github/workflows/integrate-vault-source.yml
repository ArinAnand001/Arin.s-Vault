name: One-time Vault source integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-vault-source.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the original Android source safely
        run: |
          set -euo pipefail
          test -f Vault-app.zip
          if [ -e vault-app ]; then
            echo "::error::vault-app/ already exists; refusing to overwrite source."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("Vault-app.zip")
          destination = Path("vault-app")
          prefix = "vault-app/"
          written = []
          skipped = []

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if not any(item.filename == prefix or item.filename.startswith(prefix) for item in members):
                  raise SystemExit("ZIP does not contain the expected vault-app/ project folder.")

              for item in members:
                  name = item.filename
                  if not name.startswith(prefix):
                      continue
                  relative = name[len(prefix):]
                  if not relative:
                      continue
                  parts = PurePosixPath(relative).parts
                  if PurePosixPath(relative).is_absolute() or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symlinks are not allowed in the source archive: {name}")
                  if any(part == "__MACOSX" for part in parts) or parts[-1] == ".DS_Store":
                      continue
                  if parts[-1] in {"local.properties", "key.properties"} or parts[-1].lower().endswith((".jks", ".keystore")):
                      skipped.append(name)
                      continue

                  target = destination.joinpath(*parts)
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(item))
                      written.append(str(target))

          if not (destination / "settings.gradle").is_file():
              raise SystemExit("Extracted source is missing vault-app/settings.gradle.")
          if not (destination / "app" / "build.gradle").is_file():
              raise SystemExit("Extracted source is missing vault-app/app/build.gradle.")

          print(f"Extracted {len(written)} project files.")
          if skipped:
              print("Skipped local signing/config files:")
              for name in skipped:
                  print(f"  - {name}")
          PY

      - name: Commit the source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault-app
          git commit -m "Integrate original Vault Android source"
          git push origin HEAD:main

      - name: Remove this one-time integration workflow
        if: success()
        run: |
          set -euo pipefail
          rm .github/workflows/integrate-vault-source.yml
          git add .github/workflows/integrate-vault-source.yml
          git commit -m "Remove one-time Vault source integration workflow"
          git push origin HEAD:main

      - name: Report integration
        if: success()
        run: |
          echo "Original source is now available under vault-app/." >> "$GITHUB_STEP_SUMMARY"
          echo "The original Vault-app.zip has been retained as a backup." >> "$GITHUB_STEP_SUMMARY"
