name: Inspect current Vault preview certificate

on:
  push:
    paths:
      - '.github/workflows/inspect-preview-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the already-published Preview 1.5 APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/preview-v1.5/Vault-preview.apk" \
            -o "$RUNNER_TEMP/Vault-preview-1.5.apk"

      - name: Read its signing certificate
        run: |
          set -euo pipefail
          keytool -printcert -jarfile "$RUNNER_TEMP/Vault-preview-1.5.apk" | tee "$RUNNER_TEMP/certificate.txt"
          SHA1=$(sed -n 's/^[[:space:]]*SHA1: *//p' "$RUNNER_TEMP/certificate.txt" | head -n 1)
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read the APK SHA-1 fingerprint."
            exit 1
          fi
          {
            echo "### Installed Preview 1.5 signing fingerprint"
            echo "- Package name: `com.anand.vault`"
            echo "- SHA-1: `$SHA1`"
            echo ""
            echo "Register this fingerprint as an Android OAuth client in the same Google Cloud project as Vault's Drive API to enable Google authorization for this already-installed preview."
            echo "This fingerprint is only for Preview 1.5. The permanent release fingerprint is documented in `vault-app/GOOGLE_SIGN_IN_SETUP.md`."
          } >> "$GITHUB_STEP_SUMMARY"
