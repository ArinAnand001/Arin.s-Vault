name: Inspect current Vault preview certificate

on:
  push:
    paths:
      - '.github/workflows/inspect-preview-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the already-published Preview 1.5 APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/preview-v1.5/Vault-preview.apk" \
            -o "$RUNNER_TEMP/Vault-preview-1.5.apk"

      - name: Install Android APK signing tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "build-tools;36.0.0"
          echo "APKSIGNER=$SDK_ROOT/build-tools/36.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Read its signing certificate
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/Vault-preview-1.5.apk" | tee "$RUNNER_TEMP/certificate.txt"
          RAW_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: *//p' "$RUNNER_TEMP/certificate.txt" | head -n 1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$RAW_SHA1" ]; then
            echo "::error::Could not read the APK SHA-1 fingerprint."
            exit 1
          fi
          SHA1=$(printf '%s' "$RAW_SHA1" | sed 's/../&:/g; s/:$//')
          {
            echo "### Installed Preview 1.5 signing fingerprint"
            echo "- Package name: `com.anand.vault`"
            echo "- SHA-1: `$SHA1`"
            echo ""
            echo "Register this fingerprint as an Android OAuth client in the same Google Cloud project as Vault's Drive API to enable Google authorization for this already-installed preview."
            echo "This fingerprint is only for Preview 1.5. The permanent release fingerprint is documented in `vault-app/GOOGLE_SIGN_IN_SETUP.md`."
          } >> "$GITHUB_STEP_SUMMARY"
